<body class="act-page-public">
<header class="site-header">
  <div class="site-shell header-row">
    <p class="brand">Team Social Fund</p>
    <nav aria-label="App navigation" class="site-nav">
      <a href="/app/dashboard/" class="nav-link"><i data-lucide="bar-chart-3" class="icon"></i>Dashboard</a>
      <a href="/app/leaderboard/" class="nav-link"><i data-lucide="trophy" class="icon"></i>Leaderboard</a>
      <a href="/app/cases/" class="nav-link"><i data-lucide="gavel" class="icon"></i>Cases</a>

    <div class="public-act-hero-content">

      </p>
      <div class="public-act-hero-actions">
        <a class="btn secondary btn-responsive" href="#actContainer"><i data-lucide="book-open" class="icon icon-btn"></i>Read the Act</a>
      </div>
    </div>

    <div id="actContainer"></div>
  </section>

<script type="module" src="/js/app-act-page.js"></script>
