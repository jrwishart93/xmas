<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disbursements | Team Social Fund</title>
  <meta name="description" content="Disbursement workflows inside Team Social Fund." />
  <meta name="theme-color" content="#0b0f1d" />
  <meta name="application-name" content="Team Social Fund" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Team Social Fund" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="/app/images/icon-image-cake-on-scale.png" />
  <link rel="apple-touch-icon" href="/app/images/icon-image-cake-on-scale.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles/main.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<header class="site-header">
  <div class="site-shell header-row">
    <h1 class="section-header"><i data-lucide="wallet" class="icon"></i>Disbursements</h1>
    <nav aria-label="App navigation" class="site-nav">
      <a href="/app/dashboard/" class="nav-link"><i data-lucide="bar-chart-3" class="icon"></i>Dashboard</a>
      <a href="/app/leaderboard/" class="nav-link"><i data-lucide="trophy" class="icon"></i>Leaderboard</a>
      <a href="/app/issue/" class="nav-link"><i data-lucide="gavel" class="icon"></i>Issue</a>
      <a href="/app/disbursements/" class="nav-link" aria-current="page"><i data-lucide="wallet" class="icon"></i>Disbursements</a>
      <a href="/act/" class="nav-link"><i data-lucide="scroll-text" class="icon"></i>Act</a>
      <a href="/app/settings/" class="nav-link"><i data-lucide="settings" class="icon"></i>Settings</a>
      <a href="#" id="logoutLink" class="nav-link"><i data-lucide="x-circle" class="icon"></i>Logout</a>
    </nav>
  </div>
</header>

<main class="site-shell with-fixed-header disbursements-page">
  <section class="card glass-panel p-responsive fund-hero">
    <p class="eyebrow">Where the money goes</p>
    <h2>Fund spending</h2>
    <div class="spend-totals">
      <p><span class="muted">Paid in</span><strong id="spendIn">£0.00</strong></p>
      <p><span class="muted">Spent</span><strong id="spendOut">£0.00</strong></p>
      <p><span class="muted">Left in the fund</span><strong id="spendLeft">£0.00</strong></p>
    </div>
    <div class="spend-meter" aria-hidden="true"><span id="spendMeter"></span></div>
    <p class="muted spend-note">“Paid in” comes from the Monzo payment history on the leaderboard.</p>
  </section>

  <section class="card p-responsive" id="spendFormCard" hidden aria-labelledby="spendFormTitle">
    <h2 class="section-header" id="spendFormTitle"><i data-lucide="receipt" class="icon"></i>Record spending <span class="badge">Admin</span></h2>
    <form id="spendForm" class="case-form" novalidate>
      <label class="case-form__field">What was it for?
        <input id="spendDescription" type="text" maxlength="140" placeholder="e.g. Christmas night deposit" required />
      </label>
      <div class="spend-form__row">
        <label class="case-form__field">Amount (£)
          <input id="spendAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="25.00" required />
        </label>
        <label class="case-form__field">Date
          <input id="spendDate" type="date" required />
        </label>
      </div>
      <button type="submit" class="btn btn-responsive" id="spendSubmit"><i data-lucide="plus" class="icon icon-btn"></i>Add to the log</button>
      <p class="case-form__status" id="spendStatus" role="status" hidden></p>
    </form>
  </section>

  <section class="card p-responsive" aria-labelledby="spendListTitle">
    <h2 class="section-header" id="spendListTitle"><i data-lucide="wallet" class="icon"></i>Spending log</h2>
    <ol class="payment-history__list" id="spendList"><li class="muted">Loading…</li></ol>
  </section>
</main>
<script type="module" src="/js/disbursements-page.js"></script>
</body>
</html>
