<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue SCN | Team Social Fund</title>
  <meta name="description" content="Issue and manage SCNs inside Team Social Fund." />
  <meta name="theme-color" content="#0b0f1d" />
  <meta name="application-name" content="Team Social Fund" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Team Social Fund" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="/app/images/icon-image-cake-on-scale.png" />
  <link rel="apple-touch-icon" href="/app/images/icon-image-cake-on-scale.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles/main.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<header class="site-header">
  <div class="site-shell header-row">
    <p class="brand">SCN Management</p>
    <div class="app-nav-meta">
      <nav aria-label="App navigation" class="site-nav">
        <a href="/app/dashboard/" class="nav-link"><i data-lucide="bar-chart-3" class="icon"></i>Dashboard</a>
        <a href="/app/leaderboard/" class="nav-link"><i data-lucide="trophy" class="icon"></i>Leaderboard</a>
        <a href="/app/issue/" class="nav-link" aria-current="page"><i data-lucide="gavel" class="icon"></i>Issue</a>
        <a href="/app/disbursements/" class="nav-link" data-preview-route><i data-lucide="wallet" class="icon"></i>Disbursements</a>
        <a href="/app/act/" class="nav-link"><i data-lucide="scroll-text" class="icon"></i>Act</a>
        <a href="#" class="nav-link" data-preview-gate><i data-lucide="settings" class="icon"></i>Settings</a>
        <a href="#" id="logoutLink" class="nav-link"><i data-lucide="x-circle" class="icon"></i>Logout</a>
      </nav>
      <span class="avatar-dot" aria-hidden="true"></span>
    </div>
  </div>
</header>

<main class="site-shell with-fixed-header">
  <section class="card glass-panel">
    <p class="eyebrow">Case management</p>
    <h1>Manage SCNs</h1>
    <p class="muted">Select the relevant clause and record the supporting details for each notice.</p>
  </section>

  <section class="form-grid content-grid">
    <section class="card p-responsive">
      <h2 class="section-header"><i data-lucide="scale" class="icon"></i>Record Your Own SCN</h2>
      <form id="confessForm">
        <label>Clause<select id="confessClause"></select></label>

        <fieldset class="disposal-options">
          <label class="disposal-option"><input type="radio" name="confessDisposal" checked /> Monetary (Preferred)</label>
          <label class="disposal-option"><input type="radio" name="confessDisposal" /> Cakes (Alternative)</label>
          <label class="disposal-option"><input type="radio" name="confessDisposal" /> Combined</label>
        </fieldset>

        <label>Summary<textarea id="confessBrief" placeholder="Provide a concise summary of the circumstances."></textarea></label>
        <button type="submit" class="btn-responsive" data-preview-gate><i data-lucide="check-circle-2" class="icon icon-btn"></i>Issue SCN</button>
      </form>
    </section>

    <section class="card p-responsive">
      <h2 class="section-header"><i data-lucide="scroll-text" class="icon"></i>Issue an SCN to a Member</h2>
      <form id="allegeForm">
        <label>Member<select id="accusedUser"></select></label>
        <label>Clause<select id="allegeClause"></select></label>

        <fieldset class="disposal-options">
          <label class="disposal-option"><input type="radio" name="allegeDisposal" checked /> Monetary (Preferred)</label>
          <label class="disposal-option"><input type="radio" name="allegeDisposal" /> Cakes (Alternative)</label>
          <label class="disposal-option"><input type="radio" name="allegeDisposal" /> Combined</label>
        </fieldset>

        <label>Summary<textarea id="allegeBrief" placeholder="Provide a concise summary of why this clause applies."></textarea></label>
        <button type="submit" class="btn-responsive" data-preview-gate><i data-lucide="check-circle-2" class="icon icon-btn"></i>Issue SCN</button>
      </form>
    </section>
  </section>

  <section class="card"><h2 class="section-header"><i data-lucide="alert-triangle" class="icon"></i>SCNs Assigned to Me</h2><div id="againstMe"></div></section>
  <section class="card"><h2 class="section-header"><i data-lucide="user" class="icon"></i>SCNs I Issued</h2><div id="iRaised"></div></section>
  <section class="card"><h2 class="section-header"><i data-lucide="check-circle-2" class="icon"></i>Resolved Cases</h2><div id="resolved"></div></section>
</main>

<script type="module" src="/js/cases-page.js"></script>
</body>
</html>
