<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard | Team Social Fund</title>
  <meta name="description" content="Contribution leaderboard for Team Social Fund members." />
  <meta name="theme-color" content="#0b0f1d" />
  <meta name="application-name" content="Team Social Fund" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Team Social Fund" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="/app/images/icon-image-cake-on-scale.png" />
  <link rel="apple-touch-icon" href="/app/images/icon-image-cake-on-scale.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles/main.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<header class="site-header">
  <div class="site-shell header-row">
    <h1 class="section-header"><i data-lucide="trophy" class="icon"></i>Team Leaderboard</h1>
    <nav aria-label="App navigation" class="site-nav">
      <a href="/app/dashboard/" class="nav-link"><i data-lucide="bar-chart-3" class="icon"></i>Dashboard</a>
      <a href="/app/leaderboard/" class="nav-link" aria-current="page"><i data-lucide="trophy" class="icon"></i>Leaderboard</a>
      <a href="/app/issue/" class="nav-link"><i data-lucide="gavel" class="icon"></i>Issue</a>
      <a href="/app/disbursements/" class="nav-link" data-preview-route><i data-lucide="wallet" class="icon"></i>Disbursements</a>
      <a href="/act/" class="nav-link"><i data-lucide="scroll-text" class="icon"></i>Act</a>
      <a href="#" class="nav-link" data-preview-gate><i data-lucide="settings" class="icon"></i>Settings</a>
      <a href="#" id="logoutLink" class="nav-link"><i data-lucide="x-circle" class="icon"></i>Logout</a>
    </nav>
  </div>
</header>
<main class="site-shell with-fixed-header">
  <section class="card p-responsive leaderboard-shell">
    <p class="leaderboard-total-label">Total team funds: <strong id="leaderboardTotalFunds">£0.00</strong></p>

    <article class="leaderboard-summary-card">
      <p><strong id="leaderboardSummaryTotal">£0.00</strong> collected</p>
      <p><strong id="leaderboardPaymentCount">0</strong> payments received</p>
      <p><strong id="leaderboardContributorCount">0</strong> contributors</p>
    </article>

    <div class="leaderboard-cards" id="rows"></div>
  </section>
</main>
<script type="module" src="/js/leaderboard-page.js"></script>
</body>
</html>
