<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Your Choices</title>
    <link rel="stylesheet" href="public/style.css">
</head>
<body class="choices-page">
    <div class="snowfall"></div>
    <div id="budgetBar">
      <span id="budgetText">Budget: £20.00</span>
    </div>
    <div class="choices-page-content">
        <div class="container">
            <div class="header">
                <h1>🎄 Make Your Choices</h1>
            </div>
            <div id="userBadge" class="user-badge hidden" aria-live="polite"></div>
            <div class="page-links">
                <button id="dashboardBtn" class="dashboard-btn" type="button">Dashboard</button>
            </div>
            <p id="menu-status" class="status-text" role="status" aria-live="polite"></p>
            <div id="menu-container">
                <!-- Menu items will be dynamically inserted here -->
            </div>
            <div class="submit-sticky-wrapper">
                <div class="submit-actions">
                    <button id="submitChoices" class="submit-xmas-btn" disabled>Submit Choices</button>
                    <button id="resetChoicesBtn" class="btn-reset-secondary" type="button">Reset my choices</button>
                    <p id="reset-status" class="status-text reset-status" role="status" aria-live="polite"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="resetDialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="resetDialogTitle" aria-describedby="resetDialogDescription" hidden>
      <div class="modal-content glass">
        <h2 id="resetDialogTitle">Reset your selections?</h2>
        <p id="resetDialogDescription">This will clear all the drinks and snacks you have chosen for this night. You can pick again afterwards.</p>
        <div class="modal-actions">
          <button id="cancelReset" class="ghost-reset-btn" type="button">Cancel</button>
          <button id="confirmReset" class="danger-btn" type="button">Reset choices</button>
        </div>
      </div>
    </div>

    <script>
      // Create and append snow elements for the animation
      const snowfallContainer = document.querySelector('.snowfall');
      if (snowfallContainer) {
        for (let i = 0; i < 150; i++) {
          const snow = document.createElement('div');
          snow.className = 'snow';
          const size = Math.random() * 4 + 1;
          snow.style.width = `${size}px`;
          snow.style.height = `${size}px`;
          snow.style.left = `${Math.random() * 100}%`;
          snow.style.animationDuration = `${Math.random() * 5 + 5}s`;
          snow.style.animationDelay = `${Math.random() * 5}s`;
          snow.style.opacity = Math.random();
          snowfallContainer.appendChild(snow);
        }
      }

      const dashboardBtn = document.getElementById('dashboardBtn');
      if (dashboardBtn) {
        dashboardBtn.addEventListener('click', () => {
          window.location.href = 'dashboard.html';
        });
      }
    </script>
    <script type="module" src="choices.js"></script>
</body>
</html>
