<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Xmas Night Out — Login</title>
  <link rel="stylesheet" href="public/style.css" />
</head>

<body>
  <div class="snowfall"></div>

  <div class="container">
    <div class="login-header">
      <span class="xmas-emoji">🎄</span>
      <h1>Work Xmas Night Out</h1>
      <p>Please log in to pick your drinks & snacks</p>
    </div>

    <div class="card">
      <label for="nameSelect">Your Name</label>
      <select id="nameSelect">
        <option value="">Select your name...</option>
      </select>

      <br><br>

      <label for="pinInput">Last 4 digits of your phone</label>
      <input type="password" id="pinInput" maxlength="4" placeholder="••••">

      <div id="loginError"></div>

      <button id="loginBtn">Continue</button>
    </div>
  </div>

  <script>
    // Create and append snow elements for the animation
    const snowfallContainer = document.querySelector('.snowfall');
    if (snowfallContainer) {
      for (let i = 0; i < 150; i++) {
        const snow = document.createElement('div');
        snow.className = 'snow';
        const size = Math.random() * 4 + 1;
        snow.style.width = `${size}px`;
        snow.style.height = `${size}px`;
        snow.style.left = `${Math.random() * 100}%`;
        snow.style.animationDuration = `${Math.random() * 5 + 5}s`; // 5-10 seconds
        snow.style.animationDelay = `${Math.random() * 5}s`;
        snow.style.opacity = Math.random();
        snowfallContainer.appendChild(snow);
      }
    }
  </script>
  <script type="module" src="login.js"></script>

</body>
</html>
