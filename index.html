<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0f1f" />
  <title>Work Xmas Night Out — Login</title>
  <link rel="stylesheet" href="public/style.css" />
  <link rel="preload" href="public/style.css" as="style" />
  <noscript><style>.js-only{display:none!important}</style></noscript>
</head>

<body>
  <div class="gold-dust js-only" aria-hidden="true"></div>

  <main class="container" role="main">
    
    <header class="neon-header">
      <div class="neon-sign flicker-slow">
        <span class="neon-text-pink">BREWHEMIA</span>
        <span class="neon-text-blue">XMAS BASH</span>
      </div>
      <p class="vip-subtitle">VIP GUEST LIST CHECK-IN</p>
    </header>

    <section class="card glass vip-card">
      <form id="loginForm" novalidate>
        <label for="nameSelect" class="vip-label">Guest Name</label>
        <div class="field">
          <select id="nameSelect" required class="vip-input">
            <option value="">Scanning Guest List...</option>
          </select>
        </div>

        <div id="selectedUserCard" class="selected-user-card hidden" aria-live="polite"></div>

        <label for="pinInput" class="vip-label">Passcode</label>
        <div class="field field-inline">
          <input
            type="password"
            id="pinInput"
            class="vip-input"
            inputmode="numeric"
            pattern="\d{4}"
            maxlength="4"
            placeholder="••••"
            required
          />
          <button type="button" id="togglePin" class="btn-text-gold">Reveal</button>
        </div>

        <div class="bouncer-status">
          <p id="loginError" class="error-msg"></p>
          <p id="successMsg" class="success-msg hidden">ACCESS GRANTED</p>
        </div>

        <div class="actions">
          <button id="loginBtn" class="btn-neon" type="submit" disabled>
            CHECK LIST
          </button>
        </div>
      </form>
    </section>

    <footer class="muted footer-minimal">
      <small>Strictly Invite Only • 18+ • No Scrooges</small>
    </footer>
  </main>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const wrap = document.querySelector('.gold-dust');
      if (!wrap) return;
      const count = 50; 
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'dust-particle';
        const size = 2 + Math.random() * 4;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDuration = (5 + Math.random() * 10).toFixed(2) + 's';
        s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
        frag.appendChild(s);
      }
      wrap.appendChild(frag);
    })();
  </script>

  <script type="module">
    const nameSelect = document.getElementById('nameSelect');
    const pinInput = document.getElementById('pinInput');
    const btn = document.getElementById('loginBtn');
    const successMsg = document.getElementById('successMsg');
    const togglePin = document.getElementById('togglePin');

    // UI Validation
    const validate = () => {
      const isValid = nameSelect.value && /^\d{4}$/.test(pinInput.value);
      btn.disabled = !isValid;
      btn.classList.toggle('btn-neon-active', isValid); 
    };

    nameSelect.addEventListener('change', validate);
    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
      validate();
    });

    togglePin.addEventListener('click', () => {
      const isPass = pinInput.type === 'password';
      pinInput.type = isPass ? 'text' : 'password';
      togglePin.textContent = isPass ? 'Hide' : 'Reveal';
    });

    // Submit Animation Wrapper
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = '<span class="flicker-fast">VERIFYING...</span>';
      
      // Visual delay before triggering actual login logic
      setTimeout(() => {
        successMsg.classList.remove('hidden');
        successMsg.classList.add('glow-text');
        // Dispatches event to existing login.js
        document.getElementById('loginBtn').dispatchEvent(new Event('click', {bubbles:true}));
      }, 800);
    });

    // Placeholder logic (Keep this or rely on login.js)
    setTimeout(() => {
        if (nameSelect.options.length <= 1) nameSelect.options[0].textContent = 'Select Guest Name';
    }, 1500);
  </script>

  <script type="module" src="login.js"></script>
</body>
</html>
