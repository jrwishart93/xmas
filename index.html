<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0f1f" />
  <title>Work Xmas Night Out — Login</title>
  <link rel="stylesheet" href="public/style.css" />
  <link rel="preload" href="public/style.css" as="style" />
  <noscript><style>.js-only{display:none!important}</style></noscript>
</head>

<body>
  <div class="gold-dust js-only" aria-hidden="true"></div>

  <main class="container" role="main">
    
    <header class="neon-header">
      <div class="neon-title">
        <div class="neon-sign flicker-slow">
          <span class="neon-text-pink">BREWHEMIA</span>
          <span class="neon-text-blue">XMAS BASH</span>
        </div>
      </div>
      <p class="vip-subtitle">VIP GUEST LIST CHECK-IN</p>
    </header>

    <section class="card glass vip-card">
      <form id="loginForm" novalidate>
        <div class="avatar-picker">
          <p class="vip-label avatar-heading">Select your avatar to choose your drinks</p>
          <p class="muted-text">Tap your face to continue.</p>
          <div id="avatarGrid" class="avatar-grid" role="list" aria-label="Guest list"></div>
        </div>

        <div id="selectedUserAnnouncement" class="sr-only" aria-live="polite"></div>

        <div id="pinSection" class="pin-section hidden">
          <div id="selectedUserCard" class="selected-user-card hidden" aria-live="polite"></div>

          <div class="pin-label-row">
            <label for="pinInput" class="vip-label">Passcode</label>
            <button
              type="button"
              id="pinHintBtn"
              class="pin-hint-btn"
              aria-label="PIN hint"
              aria-expanded="false"
            >
              ?
            </button>
            <div
              id="pinHintMessage"
              class="pin-hint hidden"
              role="alert"
              aria-live="polite"
            >
              Your PIN is the last four digits of your mobile number.
            </div>
          </div>
          <div class="field field-inline">
            <input
              type="password"
              id="pinInput"
              class="vip-input"
              inputmode="numeric"
              pattern="\d{4}"
              maxlength="4"
              placeholder="••••"
              required
            />
            <button type="button" id="togglePin" class="btn-text-gold">Reveal</button>
          </div>

          <div class="bouncer-status">
            <p id="loginError" class="error-msg"></p>
            <p id="successMsg" class="success-msg hidden">ACCESS GRANTED</p>
          </div>

          <div class="actions">
            <div id="loginSpinner" class="spinner hidden" aria-hidden="true"></div>
            <button id="loginBtn" class="btn-neon" type="submit" disabled>
              CHECK LIST
            </button>
          </div>
        </div>
      </form>
    </section>

    <footer class="muted footer-minimal">
      <small>Strictly Invite Only • 18+ • No Scrooges</small>
    </footer>
  </main>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const wrap = document.querySelector('.gold-dust');
      if (!wrap) return;
      const count = 50; 
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'dust-particle';
        const size = 2 + Math.random() * 4;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDuration = (5 + Math.random() * 10).toFixed(2) + 's';
        s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
        frag.appendChild(s);
      }
      wrap.appendChild(frag);
    })();
  </script>

  <script type="module">
    const loginForm = document.getElementById('loginForm');
    const pinInput = document.getElementById('pinInput');
    const btn = document.getElementById('loginBtn');
    const successMsg = document.getElementById('successMsg');
    const togglePin = document.getElementById('togglePin');
    const pinSection = document.getElementById('pinSection');
    const pinHintBtn = document.getElementById('pinHintBtn');
    const pinHintMessage = document.getElementById('pinHintMessage');

    // UI Validation
    const validate = () => {
      const hasUser = Boolean(loginForm?.dataset.selectedUserId);
      if (hasUser) {
        pinSection?.classList.remove('hidden');
      }

      const isValid = hasUser && /^\d{4}$/.test(pinInput.value);
      btn.disabled = !isValid;
      btn.classList.toggle('btn-neon-active', isValid);
    };

    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
      validate();
    });

    togglePin.addEventListener('click', () => {
      const isPass = pinInput.type === 'password';
      pinInput.type = isPass ? 'text' : 'password';
      togglePin.textContent = isPass ? 'Hide' : 'Reveal';
    });

    const hideHint = () => {
      pinHintMessage?.classList.add('hidden');
      pinHintBtn?.setAttribute('aria-expanded', 'false');
    };

    const toggleHint = () => {
      if (!pinHintMessage) return;
      const isHidden = pinHintMessage.classList.contains('hidden');
      if (isHidden) {
        pinHintMessage.classList.remove('hidden');
        pinHintBtn?.setAttribute('aria-expanded', 'true');
      } else {
        hideHint();
      }
    };

    pinHintBtn?.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleHint();
    });

    pinHintBtn?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleHint();
      }
    });

    document.addEventListener('click', (event) => {
      if (!pinHintMessage || pinHintMessage.classList.contains('hidden')) return;
      if (pinHintMessage.contains(event.target) || pinHintBtn?.contains(event.target)) return;
      hideHint();
    });

    // Submit Animation Wrapper
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document
        .getElementById('loginBtn')
        .dispatchEvent(new Event('click', { bubbles: true }));
    });

    document.addEventListener('userSelectionChanged', validate);
  </script>

  <script type="module" src="login.js"></script>
</body>
</html>
