<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas Predictions — Results</title>
  <link rel="stylesheet" href="public/style.css" />
</head>
<body class="results-page">
  <div class="snowfall"></div>
  <main class="results-wrapper" role="main">
    <nav class="results-nav" aria-label="Breadcrumb">
      <a href="dashboard.html" class="back-link">← Back to dashboard</a>
    </nav>

    <header class="results-header">
      <p class="eyebrow">Christmas Predictions</p>
      <h1>Christmas Predictions — Results</h1>
      <p class="muted-text">See how the team thinks the night will unfold.</p>
    </header>

    <section class="results-summary" id="resultsSummary" aria-live="polite"></section>

    <div id="resultsContainer" class="results-grid"></div>

    <div class="results-actions">
      <button onclick="window.location.href='vote.html'" class="btn-secondary">Cast Your Votes</button>
      <button onclick="window.location.href='dashboard.html'" class="btn-secondary">Back to Dashboard</button>
    </div>
  </main>

  <script>
    const snowfallContainer = document.querySelector('.snowfall');
    if (snowfallContainer) {
      for (let i = 0; i < 120; i++) {
        const snow = document.createElement('div');
        snow.className = 'snow';
        const size = Math.random() * 4 + 1;
        snow.style.width = `${size}px`;
        snow.style.height = `${size}px`;
        snow.style.left = `${Math.random() * 100}%`;
        snow.style.animationDuration = `${Math.random() * 5 + 5}s`;
        snow.style.animationDelay = `${Math.random() * 5}s`;
        snow.style.opacity = Math.random();
        snowfallContainer.appendChild(snow);
      }
    }
  </script>
  <script type="module" src="./votes_results.js"></script>
</body>
</html>
